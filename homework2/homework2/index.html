<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Buy List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
 <div class="left-column">

<div class="add-panel">
<input id="productInput" type="text" placeholder="Назва товару">
<button id="addButton" data-tooltip="Додати товар">Додати</button>
</div>

<div id="productList"></div> 

</div>

<div class="right-column">
<div class="block">
<h2>Залишилося</h2>
<div id="leftStats"></div>
</div>

<div class="block">
<h2>Куплено</h2>
<div id="boughtStats"></div>
</div>

</div>

<div class="badge">BuyList</div>
<script src="script.js"></script>

</body>
</html>
